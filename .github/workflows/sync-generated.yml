name: Sync generated site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'client.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-generated
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild plugin and static site
        run: |
          node build.mjs
          node build-demo.mjs

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - name: Commit generated files
        run: |
          if git diff --quiet -- docs client.js; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs client.js
          git commit -m "chore: rebuild generated site [skip ci]"
          git push
